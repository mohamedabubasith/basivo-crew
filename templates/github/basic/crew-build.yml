# Basivo Crew — Basic tier, build.
# Issue labelled `crew:build` (or `@claude` in a comment) -> developer writes the change,
# reviewer checks its own diff, a pull request opens.
name: Crew build

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: crew-build-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  build:
    # The label is the human gate. Remove the first condition to build every new issue.
    if: |
      (github.event_name == 'issues' && github.event.label.name == 'crew:build') ||
      (github.event_name == 'issue_comment' && !github.event.issue.pull_request &&
       contains(github.event.comment.body, '@claude'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
      issues: write
      pull-requests: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mohamedabubasith/basivo-plugins.git
          plugins: basivo-crew@basivo
          display_report: true
          track_progress: true
          claude_args: --max-turns 40
          prompt: |
            Issue #${{ github.event.issue.number }} in ${{ github.repository }} is the work order.

            Title: ${{ github.event.issue.title }}

            Read `.basivo-crew.yml` first if it exists: `off_limits` paths are not yours to
            edit even if the issue asks, and `checks` names the commands to run.

            Run the Basic crew, in order:

            1. Delegate to the `basivo-crew:developer` subagent. Give it the issue title and
               body as the action items, and tell it to run this project's own lint, build and
               test commands.
            2. Delegate to the `basivo-crew:reviewer` subagent to review the resulting diff.
               If it returns blocking findings, hand them back to `basivo-crew:developer` and
               repeat — at most twice.
            3. Commit to a new branch and open a pull request whose body has, in this order:
               - what changed and why, in two or three lines
               - the check results from the developer, as commands and outcomes
               - the reviewer's verdict
               - **Not done / unverified** — anything you skipped, assumed, could not run, or
                 are unsure about. Never leave this section out: an automated pull request
                 looks more finished than it is, and this is the section that makes it
                 honest. Write "nothing" only if that is true.
               - `Closes #${{ github.event.issue.number }}`

            If the developer's checks still fail after two rounds, open the pull request
            anyway, mark it a draft, and say plainly at the top of the body what is failing
            and what you tried. Do not weaken a check to get green, and do not report
            a check as passing unless you ran it.

      - name: Per-agent token report
        if: always()
        run: |
          SCRIPT=$(find "$HOME/.claude" -path '*basivo-crew*/scripts/crew-cost.py' 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            python3 "$SCRIPT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Per-agent token report unavailable: the plugin's crew-cost.py was not found on the runner._" >> "$GITHUB_STEP_SUMMARY"
          fi
