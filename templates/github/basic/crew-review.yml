# Basivo Crew — Basic tier, review.
# Every pull request gets one reviewer pass, posted as a single sticky comment.
name: Crew review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: crew-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-crew]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mohamedabubasith/basivo-plugins.git
          plugins: basivo-crew@basivo
          display_report: true
          use_sticky_comment: true
          claude_args: --max-turns 20
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Event: ${{ github.event.action }}. If it is `synchronize`, this pull request has
            already been reviewed: look at your previous sticky comment, diff only the commits
            pushed since it, and report only what is new. Repeating a finding the author has
            already seen is noise, and repeating one they pushed a fix for is worse.

            If the pull request body closes an issue, read that issue first and pass its
            acceptance criteria to the reviewer — a change that does not meet them is the
            finding that matters most.

            Delegate to the `basivo-crew:reviewer` subagent, giving it the diff against the
            base branch. Post its output as your review comment, unchanged in substance,
            including its score annotations.

            Post nothing else: no summary of the diff, no praise, no restating the plan.
            If the verdict is APPROVE with no non-blocking findings, say exactly that in
            one line.

      - name: Per-agent token report
        if: always()
        run: |
          SCRIPT=$(find "$HOME/.claude" -path '*basivo-crew*/scripts/crew-cost.py' 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            python3 "$SCRIPT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Per-agent token report unavailable: the plugin's crew-cost.py was not found on the runner._" >> "$GITHUB_STEP_SUMMARY"
          fi
