# Basivo Crew — Pro tier, review.
# Every pull request gets a correctness pass and a security pass, posted as inline comments.
name: Crew review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

concurrency:
  group: crew-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  review:
    if: |
      github.event.pull_request.draft == false &&
      !contains(github.event.pull_request.title, '[skip-crew]')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: https://github.com/mohamedabubasith/basivo-plugins.git
          plugins: basivo-crew@basivo
          display_report: true
          use_sticky_comment: true
          claude_args: --max-turns 40
          prompt: |
            Review pull request #${{ github.event.pull_request.number }} in ${{ github.repository }}.

            Event: ${{ github.event.action }}. If it is `synchronize`, this pull request has
            already been reviewed: look at your previous sticky comment, diff only the commits
            pushed since it, and report only what is new. Never re-post a finding the author
            has already seen, and never re-post one they have since fixed.

            If the pull request body closes an issue, read that issue first and pass its
            acceptance criteria to both agents.

            Delegate to both, giving each the diff against the base branch:
            - `basivo-crew:reviewer` for correctness
            - `basivo-crew:security` for the trust boundaries the diff touches

            Post one review. Put the reviewer's blocking findings and the security findings
            as inline comments on their lines, and the two verdicts in the review body.
            Keep their scores. Drop a finding only if the other agent already reported the
            same defect on the same line.

            Request changes only if there is at least one blocking finding or at least one
            high-or-critical security finding. A finding either agent marked pre-existing
            never requests changes. Otherwise comment, or approve in one line when both
            come back clean.

            Post nothing else: no diff summary, no praise, no plan.

      - name: Per-agent token report
        if: always()
        run: |
          SCRIPT=$(find "$HOME/.claude" -path '*basivo-crew*/scripts/crew-cost.py' 2>/dev/null | head -1)
          if [ -n "$SCRIPT" ]; then
            python3 "$SCRIPT" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "_Per-agent token report unavailable: the plugin's crew-cost.py was not found on the runner._" >> "$GITHUB_STEP_SUMMARY"
          fi
